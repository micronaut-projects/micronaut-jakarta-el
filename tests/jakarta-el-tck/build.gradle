plugins {
    id "io.micronaut.build.internal.jakarta-el-native-test-suite"
    id "io.micronaut.build.internal.jakarta-el-tck-test-suite"
}

description = "Runs the Jakarta Expression Language TCK using compile-time generated expressions."

dependencies {
    testAnnotationProcessor projects.micronautJakartaElProcessor
    testAnnotationProcessor mn.micronaut.inject.java
    testAnnotationProcessor platform(libs.micronaut.core)

    // the TCK asks a method expression to describe a method of a type nothing contributed, which no longer
    // reflects by default: this suite adds the module that can, without adding the interpreter
    testRuntimeOnly projects.micronautJakartaElInterpreterReflection
}
