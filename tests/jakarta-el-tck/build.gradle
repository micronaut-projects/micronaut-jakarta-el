import groovy.json.JsonOutput

plugins {
    id "io.micronaut.build.internal.jakarta-el-native-test-suite"
}

description = """
The Jakarta Expression Language Technology Compatibility Kit.

The TCK bundle is not published to Maven Central, so it is resolved from the Eclipse download site and its
test classes are executed against the runtime of this repository. Run it with:

    ./gradlew :micronaut-jakarta-el-tck:test
    ./gradlew :micronaut-jakarta-el-tck:testInterpreter
    ./gradlew :micronaut-jakarta-el-tck:testInterpreterReflection
"""

configurations {
    tckBundle {
        canBeConsumed = false
        canBeResolved = true
    }
    interpreterReflectionRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    interpreterTck
}

configurations {
    interpreterTckImplementation.extendsFrom testImplementation
    interpreterTckRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    ivy {
        url = uri("https://download.eclipse.org/jakartaee/expression-language/$elTckBranch/")
        patternLayout {
            artifact "[module]-[revision].[ext]"
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule("jakarta.el", "jakarta-expression-language-tck")
        }
    }
}

dependencies {
    tckBundle "jakarta.el:jakarta-expression-language-tck:$elTckVersion@zip"

    testImplementation projects.micronautJakartaEl
    testAnnotationProcessor projects.micronautJakartaElProcessor
    testAnnotationProcessor mn.micronaut.inject.java
    testAnnotationProcessor platform(libs.micronaut.core)

    interpreterTckImplementation projects.micronautJakartaElInterpreter
    interpreterReflectionRuntime projects.micronautJakartaElInterpreterReflection
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}

// The bundle ships the TCK as a jar of compiled tests, which is unpacked so that the test task can scan it.
def unpackTckBundle = tasks.register("unpackTckBundle", Sync) {
    description = "Unpacks the Jakarta Expression Language TCK bundle"
    from({ zipTree(configurations.tckBundle.singleFile) }) {
        include "el-tck/artifacts/jakarta-expression-language-tck-*.jar"
        exclude "**/*-sources.jar"
        eachFile { it.relativePath = new RelativePath(true, "jakarta-expression-language-tck.jar") }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir("tck-bundle")
}

def unpackTckClasses = tasks.register("unpackTckClasses", Sync) {
    description = "Unpacks the TCK test classes so that they can be discovered by the test task"
    dependsOn unpackTckBundle
    from({ zipTree(layout.buildDirectory.file("tck-bundle/jakarta-expression-language-tck.jar")) })
    into layout.buildDirectory.dir("tck-classes")
}

def tckClasses = files(layout.buildDirectory.dir("tck-classes")).builtBy(unpackTckClasses)

def generatedTckExpressions = layout.buildDirectory.dir("generated/sources/tckExpressions/java")
def javaType = { String binaryName ->
    switch (binaryName) {
        // Micronaut's annotation metadata represents class-valued primitive members as their wrappers. Writing
        // the wrappers explicitly also lets the generated source match both forms through ELMethods.sameTypes.
        case "boolean": return "java.lang.Boolean.class"
        case "byte": return "java.lang.Byte.class"
        case "char": return "java.lang.Character.class"
        case "double": return "java.lang.Double.class"
        case "float": return "java.lang.Float.class"
        case "int": return "java.lang.Integer.class"
        case "long": return "java.lang.Long.class"
        case "short": return "java.lang.Short.class"
        case "void": return "void.class"
        default: return binaryName.replace('$', '.') + ".class"
    }
}
def generateTckExpressions = tasks.register("generateTckExpressions") {
    description = "Generates the compile-time declarations for the expressions exercised by the TCK"
    def inventory = layout.projectDirectory.file("src/tckExpressions/tck-expressions.tsv")
    inputs.file(inventory)
    outputs.dir(generatedTckExpressions)
    doLast {
        def outputDirectory = generatedTckExpressions.get().asFile
        delete(outputDirectory)

        def declarations = inventory.asFile.readLines().collect { line ->
            def columns = line.split("\\t", -1)
            [
                kind: columns[0],
                expression: new String(java.util.Base64.urlDecoder.decode(columns[1]), java.nio.charset.StandardCharsets.UTF_8),
                resultType: columns[2],
                parameterTypes: columns.length == 4 ? columns[3] : null
            ]
        }
        def reservedIdentifiers = [
            "and", "div", "empty", "eq", "false", "ge", "gt", "instanceof", "le", "lt", "mod", "ne",
            "not", "null", "or", "true"
        ] as Set
        def environmentIdentifiers = declarations.collectMany { declaration ->
            def withoutStrings = declaration.expression
                .replaceAll(/'(?:\\.|[^'\\])*'/, "")
                .replaceAll(/\"(?:\\.|[^\"\\])*\"/, "")
            (withoutStrings =~ /(?<![.A-Za-z0-9_$])[A-Za-z_$][A-Za-z0-9_$]*/).collect { it }
        }.findAll {
            it != '$' && !reservedIdentifiers.contains(it)
        }.toSorted().unique()
        declarations = declarations.findAll {
            it.resultType != "com.sun.ts.tests.el.spec.coercion.ELClientIT\$planets"
                && !it.expression.contains("Int:val")
        }
        def byPackage = declarations.groupBy { declaration ->
            declaration.resultType.startsWith("com.sun.ts.tests.el.spec.coercion.")
                ? "com.sun.ts.tests.el.spec.coercion"
                : "io.micronaut.el.tck.generated"
        }
        int classIndex = 0
        byPackage.each { packageName, packageDeclarations ->
            packageDeclarations.collate(100).each { chunk ->
                def className = "TckExpressions${classIndex++}"
                def packageDirectory = new File(outputDirectory, packageName.replace('.', '/'))
                packageDirectory.mkdirs()
                def source = new StringBuilder("package ${packageName};\n\n")
                source.append("@io.micronaut.el.annotation.ELEnvironment(variables = {\n")
                environmentIdentifiers.eachWithIndex { identifier, identifierIndex ->
                    source.append("    @io.micronaut.el.annotation.ELVariable(name = ")
                        .append(JsonOutput.toJson(identifier))
                        .append(", type = java.lang.Object.class)")
                    source.append(identifierIndex + 1 == environmentIdentifiers.size() ? "\n" : ",\n")
                }
                source.append("})\n")
                chunk.eachWithIndex { declaration, annotationIndex ->
                    def name = "EXPRESSION_${classIndex}_${annotationIndex}"
                    boolean handCompiled = declaration.expression.contains("testPrimitiveBooleanArray")
                        || declaration.expression.contains("testPredicateString")
                        || declaration.expression.contains("testPredicateLong")
                        || declaration.expression.startsWith('${c = 0;')
                        || declaration.expression.startsWith('${lst = [];')
                        || declaration.expression.contains('customers.stream().max(')
                        || declaration.expression.contains('customers.stream().min(')
                    boolean coreLiteral = !declaration.expression.contains('${')
                        && !declaration.expression.contains('#{')
                    // Keep a declaration in this position so generated class partitioning remains stable, but index
                    // a unique unused literal instead of shadowing the core literal or hand-compiled source.
                    def declaredExpression = handCompiled || coreLiteral
                        ? "TCK placeholder ${classIndex} ${annotationIndex}"
                        : declaration.expression
                    def expression = JsonOutput.toJson(declaredExpression)
                    if (declaration.kind == "V") {
                        source.append("@io.micronaut.el.annotation.ELExpression(value = ")
                            .append(expression)
                            .append(", expectedType = ")
                            .append(javaType(declaration.resultType))
                            .append(", name = \"").append(name).append("\")\n")
                    } else {
                        source.append("@io.micronaut.el.annotation.ELMethodExpression(value = ")
                            .append(expression)
                            .append(", expectedReturnType = ")
                            .append(javaType(declaration.resultType == "<null>" ? "java.lang.Object" : declaration.resultType))
                        if (declaration.parameterTypes != null && !declaration.parameterTypes.isEmpty()
                            && declaration.parameterTypes != "<null>") {
                            source.append(", expectedParamTypes = {")
                                .append(declaration.parameterTypes.split(',').collect { javaType(it) }.join(', '))
                                .append('}')
                        }
                        source.append(", name = \"").append(name).append("\")\n")
                    }
                }
                source.append("final class ${className} {\n}\n")
                new File(packageDirectory, "${className}.java").text = source.toString()
            }
        }
    }
}

sourceSets.test.java.srcDir(generatedTckExpressions)
tasks.named("compileTestJava") {
    dependsOn generateTckExpressions
}

dependencies {
    testImplementation tckClasses
}

def configureTckTest = { Test tckTest ->
    tckTest.testClassesDirs = tckClasses
    // The TCK names its tests *IT, which the default class name filter does not pick up.
    tckTest.filter {
        includeTestsMatching "com.sun.ts.tests.el.*"
        // The signature test verifies the signatures of the jakarta.el API jar rather than the behaviour of an
        // implementation. This repository consumes the API jar unchanged, so there is nothing for it to check.
        excludeTestsMatching "com.sun.ts.tests.signaturetest.*"
        setFailOnNoMatchingTests(false)
    }
    // The TCK asks the implementation for a VariableMapper to exercise the variable binding of the section 1.19.
    tckTest.systemProperty "variable.mapper", "io.micronaut.el.runtime.MapVariableMapper"
}

tasks.named("test", Test) {
    description = "Runs the Jakarta Expression Language TCK with compile-time expressions only"
    configureTckTest(it)
}

def testInterpreter = tasks.register("testInterpreter", Test) {
    description = "Runs the Jakarta Expression Language TCK with the reflection-free interpreter"
    group = "verification"
    configureTckTest(it)
    classpath = sourceSets.interpreterTck.runtimeClasspath
}

def testInterpreterReflection = tasks.register("testInterpreterReflection", Test) {
    description = "Runs the Jakarta Expression Language TCK with the reflective interpreter"
    group = "verification"
    configureTckTest(it)
    classpath = configurations.testRuntimeClasspath + configurations.interpreterReflectionRuntime
}

tasks.named("check") {
    dependsOn testInterpreter, testInterpreterReflection
}

// The native test binary does not inherit the system properties of the test task.
tasks.named("nativeTest") {
    runtimeArgs.add("-Dvariable.mapper=io.micronaut.el.runtime.MapVariableMapper")
}
