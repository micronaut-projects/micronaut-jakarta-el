plugins {
    id "io.micronaut.build.internal.jakarta-el-base"
    id "io.micronaut.build.internal.parent"
}

// The test suites are not modules, so the aggregating plugin does not pick them up on its own. They run the
// generated expressions of every supported language against the runtime, and the TCK runs the specification
// against it, which is the coverage of the runtime that the aggregated report would otherwise miss.
dependencies {
    jacocoAggregation projects.testSuiteJava
    jacocoAggregation projects.testSuiteGroovy
    jacocoAggregation projects.testSuiteKotlin
    jacocoAggregation projects.testSuiteCustomAnnotation
    jacocoAggregation projects.micronautTests.micronautJakartaElTck
    // the same specification run through the interpreter, with and without the reflective executor: this is
    // where the coverage of the interpreter and of that module is recorded
    jacocoAggregation projects.micronautTests.micronautJakartaElTckInterpreter
    jacocoAggregation projects.micronautTests.micronautJakartaElTckInterpreterReflection
    jacocoAggregation projects.micronautTests.micronautJakartaElFuzz
}

// The annotation processor runs inside javac while the consuming modules compile, not inside a test JVM, so
// the coverage agent never sees it and it reports as zero however well it is tested -- and it is: every
// generated expression of the Java, Groovy and Kotlin suites, of the TCK and of the processor's own tests is
// produced by it. Measuring it would mean instrumenting the compiler, so it is left out of the coverage
// figure rather than counted as untested.
//
// This is here rather than in `config/`, which the template's nightly files sync replaces.
// the plugin is applied by the build that runs the analysis, not by a local build
pluginManager.withPlugin("org.sonarqube") {
    sonar {
        properties {
            property "sonar.coverage.exclusions", "**/io/micronaut/el/processor/**"
        }
    }
}
