plugins {
    id "io.micronaut.build.internal.expression-language-test-suite"
    id 'groovy'
}

dependencies {
    // the Groovy compiler picks up the TypeElementVisitor of the processor from the compile classpath
    testImplementation mn.micronaut.inject.groovy
    testImplementation projects.micronautExpressionLanguageProcessor
    testImplementation mnSourcegen.micronaut.sourcegen.annotations

    testImplementation platform(libs.micronaut.core)
    testImplementation projects.micronautExpressionLanguage
    testImplementation mn.micronaut.core
    testImplementation mn.micronaut.inject
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}
