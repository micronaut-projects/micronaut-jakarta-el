plugins {
    id "io.micronaut.build.internal.jakarta-el-module"
}

dependencies {
    api mn.micronaut.core.processor
    compileOnly mn.micronaut.inject.java
    api mnSourcegen.micronaut.sourcegen.generator
    api projects.micronautJakartaEl
    api projects.micronautJakartaElParser

    // The Java source writer produces readable sources for a Java build; the bytecode writer is used for the
    // languages whose source writer cannot emit these classes yet. Both are needed on the compile classpath of a
    // Groovy build, which is why they are api rather than runtimeOnly.
    api mnSourcegen.micronaut.sourcegen.generator.java
    api mnSourcegen.micronaut.sourcegen.generator.bytecode

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}

dependencies {
    // compiles sources in memory with the Micronaut annotation processors, this one included
    testImplementation mn.micronaut.inject.java.test
    // CompiledVersusInterpretedTest evaluates the same expression both ways and compares the two
    testImplementation projects.micronautJakartaElInterpreter
    testRuntimeOnly projects.micronautJakartaElInterpreterReflection
}
