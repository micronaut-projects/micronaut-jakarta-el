plugins {
    id "io.micronaut.build.internal.jakarta-el-module"
}

noReflection {
    // the runtime is extended through services - the generated expression sources, the method contributors and
    // executors, the resolvers and the proxy factory - which a native image loads without further metadata
    allow 'SERVICE_LOADING'
}

dependencies {
    api libs.managed.jakarta.el
    api mn.micronaut.core
    // BeanContext and the executable methods of a BeanDefinition, read by ExecutableMethodELExecutor
    api mn.micronaut.inject
    api projects.micronautJakartaElAnnotations

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}
