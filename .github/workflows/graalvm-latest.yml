# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: GraalVM Latest CI
# Called by Java CI (gradle.yml) once its build job passes and the Sonar quality gate did not
# fail. The caller's triggers, draft check and concurrency group cover this workflow, so it
# declares no concurrency of its own; reusing the caller's group expression here would make
# the called jobs wait on, or cancel, their own run.
on:
  workflow_call:
jobs:
  build_matrix:
    if: github.repository != 'micronaut-projects/micronaut-project-template' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_cachePush: ${{ github.event_name == 'push' }}
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Matrix
        uses: micronaut-projects/github-actions/graalvm/build-matrix@23bd738fa73948e51347bb1043dcbfc4b4e0f5e1 # github-actions#58
        id: build-matrix
        with:
          java-version: '25'
          # Exchanged for a short-lived token by setup-gradle inside the action; see gradle.yml for the key selection.
          develocity-access-key: >-
            ${{ (github.event_name == 'push' && secrets.GRADLE_ENTERPRISE_ACCESS_KEY) ||
                (github.event_name != 'push' && (secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY)) ||
                '' }}
  build:
    needs: build_matrix
    if: github.repository != 'micronaut-projects/micronaut-project-template'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_cachePush: ${{ github.event_name == 'push' }}
    strategy:
      max-parallel: 6
      matrix:
        java: ['25']
        native_test_task: ${{ fromJson(needs.build_matrix.outputs.matrix).native_test_task }}
    steps:
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pre-Build Steps
        uses: micronaut-projects/github-actions/graalvm/pre-build@23bd738fa73948e51347bb1043dcbfc4b4e0f5e1 # github-actions#58
        id: pre-build
        with:
          # Exchanged for a short-lived token that the following steps receive as DEVELOCITY_ACCESS_KEY and
          # GRADLE_ENTERPRISE_ACCESS_KEY. Do not set either variable on later steps: it would replace the token.
          develocity-access-key: >-
            ${{ (github.event_name == 'push' && secrets.GRADLE_ENTERPRISE_ACCESS_KEY) ||
                (github.event_name != 'push' && (secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY)) ||
                '' }}
          distribution: 'graalvm'
          gradle-java: '25'
          java: ${{ matrix.java }}
          nativeTestTask: ${{ matrix.native_test_task }}
      - name: Build Steps
        uses: micronaut-projects/github-actions/graalvm/build@23bd738fa73948e51347bb1043dcbfc4b4e0f5e1 # github-actions#58
        id: build
        env:
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GRAALVM_QUICK_BUILD: true
          NATIVE_IMAGE_OPTIONS: "-H:+ReportExceptionStackTraces"
        with:
          nativeTestTask: ${{ matrix.native_test_task }}
      - name: Post-Build Steps
        uses: micronaut-projects/github-actions/graalvm/post-build@23bd738fa73948e51347bb1043dcbfc4b4e0f5e1 # github-actions#58
        id: post-build
        with:
          java: ${{ matrix.java }}
